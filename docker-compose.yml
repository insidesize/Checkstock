services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
